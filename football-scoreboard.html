<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --field:      #2f5e34;
    --field-dark: #244b28;
    --field-line: #3d7343;
    --cream:      #F5F0E8;
    --gray:       #9a9a9a;
    --dark:       #16241a;
    --cfb-head:   #7a4a24;
    --cfb-head2:  #8a5a30;
    --nfl-head:   #6b4a2a;
    --gold:       #EAAA00;
    --red:        #CE1141;
    --card:       #ffffff;
    --card-ink:   #1a1a1a;
    --card-sub:   #6a6a6a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--field);
    color: var(--cream);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── Field yard-line layer (behind everything) ── */
  .field {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .yard-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: rgba(245,240,232,0.08);
  }
  .yard-line.major { width: 3px; background: rgba(245,240,232,0.18); }
  .yard-num {
    position: absolute;
    font-family: 'Bebas Neue', cursive;
    font-size: 72px;
    line-height: 1;
    color: rgba(245,240,232,0.08);
    letter-spacing: 2px;
    transform: translateX(-50%);
    user-select: none;
  }
  .yard-num.top { top: 10px; }
  .yard-num.bottom { bottom: 10px; }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1500px;
    margin: 0 auto;
    padding: 96px 28px 16px;
  }

  /* ── Board: two sport groups side by side; each caps a 2-week grid ── */
  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    align-items: start;
  }
  .sport-group { min-width: 0; }

  .col-head {
    text-align: center;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--cream);
    padding: 9px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .col-head.cfb { background: linear-gradient(180deg, var(--cfb-head2), var(--cfb-head)); }
  .col-head.nfl { background: linear-gradient(180deg, var(--nfl-head), #5a3f24); }

  .week-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  .week-col { min-width: 0; }

  .week-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.9);
    margin: 0 2px 9px;
    text-transform: uppercase;
  }

  /* ── Game card ── */
  .game {
    background: var(--card);
    color: var(--card-ink);
    border-radius: 5px;
    padding: 6px 13px;
    margin-bottom: 9px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    opacity: 0;
    transform: translateY(5px);
    animation: fadeUp 0.35s forwards;
  }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  .game.tab-gold::before,
  .game.tab-red::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
  }
  .game.tab-gold::before { background: var(--gold); }
  .game.tab-red::before  { background: var(--red); }
  .game.tab-gold, .game.tab-red { padding-left: 14px; }

  .game.live-game { box-shadow: 0 0 0 2px var(--red), 0 2px 8px rgba(0,0,0,0.25); }

  /* meta row: date + status */
  .g-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--card-sub);
    text-transform: uppercase;
    margin-bottom: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .g-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .g-badge.final { background: #eee;       color: #555; }
  .g-badge.live  { background: var(--red); color: #fff; animation: glow 2s ease-in-out infinite alternate; }
  @keyframes glow { from{box-shadow:0 0 3px rgba(206,17,65,0.4);} to{box-shadow:0 0 12px rgba(206,17,65,0.85);} }

  /* stacked team rows */
  .g-team {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
  }
  .g-team + .g-team { border-top: 1px solid #f0f0f0; }

  .g-name {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.15;
    color: var(--card-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .g-name .rank { color: var(--red); font-weight: 700; font-size: 20px; vertical-align: 1px; margin-right: 3px; }

  /* winner arrow — its own track, never clipped by name truncation */
  .g-arrow {
    width: 0; height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 9px solid var(--field);
  }

  .g-num {
    font-family: 'Bebas Neue', cursive;
    font-size: 30px;
    line-height: 0.9;
    letter-spacing: 1px;
    color: var(--card-ink);
    min-width: 34px;
    text-align: right;
  }

  /* winner / loser emphasis */
  .g-team.winner .g-name { font-weight: 700; }
  .g-team.winner .g-num  { color: var(--card-ink); }
  .g-team.loser .g-name { color: #a5a5a5; font-weight: 400; }
  .g-team.loser .g-num  { color: #bcbcbc; }

  .g-team.live .g-num { color: var(--red); }

  /* kickoff time for unplayed games — compact, sized like a score number
     so upcoming cards stay as thin as final cards and the team names remain
     the dominant text on the card */
  .g-kick {
    font-family: 'Bebas Neue', cursive;
    font-size: 24px;
    line-height: 1;
    letter-spacing: 0.5px;
    color: var(--field);
    text-align: right;
    white-space: nowrap;
  }

  /* network shown on the right, under the kickoff time (upcoming games) */
  .g-net-right {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8.5px;
    color: #999;
    letter-spacing: 0.5px;
    text-align: right;
    white-space: nowrap;
    grid-column: 2 / 4;   /* span arrow + right track so wider names fit */
  }
  .g-kick { grid-column: 2 / 4; }   /* same span for the time above it */

  .g-net {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #999;
    letter-spacing: 0.5px;
    margin-left: auto;      /* push to the right edge of the meta row */
    white-space: nowrap;
    padding-left: 8px;
  }

  /* ── loading / error ── */
  .loading-state, .error-state {
    text-align: center; padding: 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; color: rgba(255,255,255,0.7); letter-spacing: 2px;
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--cream);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="field" id="field" aria-hidden="true"></div>
<div class="container">

  <div class="board">
    <div class="sport-group">
      <div class="col-head cfb">COLLEGE FOOTBALL</div>
      <div class="week-grid" id="cfb-body">
        <div class="loading-state"><div class="spinner"></div>LOADING…</div>
      </div>
    </div>
    <div class="sport-group">
      <div class="col-head nfl">NFL</div>
      <div class="week-grid" id="nfl-body">
        <div class="loading-state"><div class="spinner"></div>LOADING…</div>
      </div>
    </div>
  </div>

</div>

<script>
/* ── Field yard markers: a few evenly spaced numbered lines ── */
  const YARDS = [10, 20, 30, 40, 50, 40, 30, 20, 10];   // real field sequence
  function buildField() {
    const field = document.getElementById('field');
    if (!field) return;
    field.innerHTML = '';
    const n = YARDS.length;
    YARDS.forEach((yd, i) => {
      const pct = (i + 1) * 100 / (n + 1);   // even spacing, margins on both edges
      const line = document.createElement('div');
      line.className = 'yard-line' + (yd === 50 ? ' major' : '');
      line.style.left = pct + '%';
      field.appendChild(line);

      const top = document.createElement('div');
      top.className = 'yard-num top';
      top.style.left = pct + '%';
      top.textContent = yd;
      field.appendChild(top);

      const bot = document.createElement('div');
      bot.className = 'yard-num bottom';
      bot.style.left = pct + '%';
      bot.textContent = yd;
      field.appendChild(bot);
    });
  }
  buildField();
  window.addEventListener('resize', buildField);

/* ============================================================
   THE GAMES FROM YOUR DECK.
   Each game lists the date to query ESPN for, the two team
   name-fragments to match in that day's scoreboard, the network,
   any AP rank shown, and an optional "tab" color (gold=GT, red=UGA/ATL).
   Scores + status are filled live from ESPN; if a game isn't found
   (schedule not yet posted), it falls back to the scheduled time shown.
   ============================================================ */

  const CFB = 'college-football';
  const NFL = 'nfl';

  const cfbGames = [
    { week: 'WEEK 1 · RESULTS', date: '20260903', league: CFB, away: 'Colorado', home: 'Georgia Tech', net: '', tab: 'gold', fallback: { time: 'THU · SEP 3', score: '13–14' } },
    { week: 'WEEK 1 · RESULTS', date: '20260905', league: CFB, away: 'Tennessee State', home: 'Georgia', net: '', tab: 'red',  fallback: { time: 'SAT · SEP 5', score: '3–63' } },
    { week: 'WEEK 1 · RESULTS', date: '20260905', league: CFB, away: 'Clemson', home: 'LSU', rankHome: '11', net: '', fallback: { time: 'SAT · SEP 5', score: '10–51' } },
    { week: 'WEEK 1 · RESULTS', date: '20260906', league: CFB, away: 'Notre Dame', rankAway: '5', home: 'Wisconsin', net: '', fallback: { time: 'SUN · SEP 6', score: '41–13' } },

    { week: 'WEEK 2 · SEPT 12 · UPCOMING', date: '20260912', league: CFB, away: 'Ohio State', rankAway: '1', home: 'Texas', rankHome: '5', net: 'ABC · GAMEDAY', fallback: { time: 'SAT · SEP 12 · 7:30 PM ET' } },
    { week: 'WEEK 2 · SEPT 12 · UPCOMING', date: '20260912', league: CFB, away: 'Tennessee', home: 'Georgia Tech', net: 'ESPN', tab: 'gold', fallback: { time: 'SAT · SEP 12 · 7:00 PM ET' } },
    { week: 'WEEK 2 · SEPT 12 · UPCOMING', date: '20260912', league: CFB, away: 'Western Kentucky', home: 'Georgia', net: 'SEC NETWORK', tab: 'red', fallback: { time: 'SAT · SEP 12 · 12:45 PM ET' } },
    { week: 'WEEK 2 · SEPT 12 · UPCOMING', date: '20260912', league: CFB, away: 'Oregon', rankAway: '2', home: 'Oklahoma State', net: 'ESPN', fallback: { time: 'SAT · SEP 12 · TBD' } },
  ];

  const nflGames = [
    { week: 'WEEK 1 · SEPT 9–14 · UPCOMING', date: '20260909', league: NFL, away: 'Patriots', home: 'Seahawks', net: 'NBC', fallback: { time: 'WED · SEP 9 · 8:20 PM ET' } },
    { week: 'WEEK 1 · SEPT 9–14 · UPCOMING', date: '20260913', league: NFL, away: 'Falcons', home: 'Steelers', net: 'FOX', tab: 'red', fallback: { time: 'SUN · SEP 13 · 1:00 PM ET' } },
    { week: 'WEEK 1 · SEPT 9–14 · UPCOMING', date: '20260913', league: NFL, away: 'Cowboys', home: 'Giants', net: 'NBC', fallback: { time: 'SUN · SEP 13 · 8:20 PM ET' } },
    { week: 'WEEK 1 · SEPT 9–14 · UPCOMING', date: '20260914', league: NFL, away: 'Broncos', home: 'Chiefs', net: 'ESPN', fallback: { time: 'MON · SEP 14 · 8:15 PM ET' } },

    { week: 'WEEK 2 · SEPT 17–21 · UPCOMING', date: '20260917', league: NFL, away: 'Lions', home: 'Bills', net: 'PRIME VIDEO', fallback: { time: 'THU · SEP 17 · 8:15 PM ET' } },
    { week: 'WEEK 2 · SEPT 17–21 · UPCOMING', date: '20260920', league: NFL, away: 'Panthers', home: 'Falcons', net: 'FOX', tab: 'red', fallback: { time: 'SUN · SEP 20 · 1:00 PM ET' } },
    { week: 'WEEK 2 · SEPT 17–21 · UPCOMING', date: '20260920', league: NFL, away: 'Colts', home: 'Chiefs', net: 'NBC', fallback: { time: 'SUN · SEP 20 · 8:20 PM ET' } },
    { week: 'WEEK 2 · SEPT 17–21 · UPCOMING', date: '20260921', league: NFL, away: 'Giants', home: 'Rams', net: 'ESPN', fallback: { time: 'MON · SEP 21 · 8:15 PM ET' } },
  ];

  const scoreboardCache = {};

  async function getScoreboard(league, date) {
    const key = league + ':' + date;
    if (scoreboardCache[key] !== undefined) return scoreboardCache[key];
    try {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/${league}/scoreboard?dates=${date}`);
      const data = await res.json();
      scoreboardCache[key] = data.events || [];
    } catch (e) {
      scoreboardCache[key] = null; // null = fetch failed (use fallback)
    }
    return scoreboardCache[key];
  }

  function norm(s) { return s.toLowerCase().replace(/[^a-z]/g, ''); }

  function matchEvent(events, away, home) {
    if (!events) return null;
    const a = norm(away), h = norm(home);
    for (const ev of events) {
      const comp = ev.competitions?.[0];
      if (!comp) continue;
      const names = comp.competitors.map(c =>
        norm((c.team?.displayName || '') + (c.team?.location || '') + (c.team?.name || ''))
      );
      const blob = names.join('|');
      if (blob.includes(a) && blob.includes(h)) return comp;
    }
    return null;
  }

  function fmtKick(iso) {
    const d = new Date(iso);
    const day = d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
    const mon = d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();
    const dt  = d.getDate();
    const tm  = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return `${day} · ${mon} ${dt} · ${tm} ET`;
  }

  function rankSpan(r) { return r ? `<span class="rank">#${r}</span>` : ''; }

  // Build one stacked team row: name | winner-arrow (or spacer) | right cell.
  // isWinner adds the arrow track; rightHTML is the score number or kickoff time.
  function teamRow(rank, name, rowClass, rightHTML, isWinner) {
    const arrow = isWinner ? `<span class="g-arrow"></span>` : `<span></span>`;
    return `
      <div class="g-team ${rowClass}">
        <div class="g-name">${rankSpan(rank)}${name}</div>
        ${arrow}
        ${rightHTML}
      </div>`;
  }

  function renderGame(g, comp) {
    const tabClass = g.tab ? ` tab-${g.tab}` : '';

    // Resolve state + scores from live data, else deck fallback.
    let state = 'pre';           // pre | in | post
    let metaDate = g.fallback.time.replace(/ · \d.*ET$/, '');
    let kickTime = (g.fallback.time.split('·').pop() || 'TBD').trim();
    let as = null, hs = null;
    let liveDetail = 'LIVE';

    if (comp) {
      state = comp.status?.type?.state || 'pre';
      const away = comp.competitors.find(c => c.homeAway === 'away');
      const home = comp.competitors.find(c => c.homeAway === 'home');
      as = away?.score; hs = home?.score;
      metaDate = fmtKick(comp.date).replace(/ · \d.*ET$/, '');
      kickTime = new Date(comp.date).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' ET';
      liveDetail = comp.status?.type?.shortDetail || 'LIVE';
    } else if (g.fallback.score) {
      state = 'post';
      [as, hs] = g.fallback.score.split('–');
      metaDate = g.fallback.time;
    }

    // Meta row: date, plus FINAL or live badge (no UPCOMING badge).
    let badgeHTML = '';
    let liveClass = '';
    if (state === 'post') badgeHTML = `<span class="g-badge final">FINAL</span>`;
    else if (state === 'in') { badgeHTML = `<span class="g-badge live">${liveDetail}</span>`; liveClass = ' live-game'; }

    // Every card has identical structure so all cards are the same height:
    // meta row + two team rows + a network line that's always rendered
    // (blank when unknown). Right cell of each team row holds score or time.
    let awayRow, homeRow;
    if (state === 'pre') {
      // Upcoming: no scores yet. Put the (compact) kickoff time on the away
      // row's right cell and leave the home row's right cell empty, so the
      // card is exactly as thin as a final and the team names dominate.
      awayRow = teamRow(g.rankAway, g.away, '', `<div class="g-kick">${kickTime}</div>`, false);
      homeRow = teamRow(g.rankHome, g.home, '', `<span></span>`, false);
    } else {
      const awayN = Number(as), homeN = Number(hs);
      const played = state === 'post';
      const liveRow = state === 'in' ? ' live' : '';
      const awayWin = played && awayN > homeN;
      const homeWin = played && homeN > awayN;
      const awayCls = played ? (awayWin ? 'winner' : awayN < homeN ? 'loser' : '') : '';
      const homeCls = played ? (homeWin ? 'winner' : homeN < awayN ? 'loser' : '') : '';
      awayRow = teamRow(g.rankAway, g.away, (awayCls + liveRow).trim(), `<div class="g-num">${as}</div>`, awayWin);
      homeRow = teamRow(g.rankHome, g.home, (homeCls + liveRow).trim(), `<div class="g-num">${hs}</div>`, homeWin);
    }

    const netTop = g.net ? `<span class="g-net">${g.net}</span>` : '';

    return `
      <div class="game${tabClass}${liveClass}">
        <div class="g-meta"><span>${metaDate}</span>${badgeHTML}${netTop}</div>
        ${awayRow}
        ${homeRow}
      </div>
    `;
  }

  function groupByWeek(list) {
    const out = [];
    let cur = null;
    for (const g of list) {
      if (!cur || cur.week !== g.week) { cur = { week: g.week, items: [] }; out.push(cur); }
      cur.items.push(g);
    }
    return out;
  }

  async function renderColumn(list, elId) {
    const comps = await Promise.all(list.map(async g => {
      const events = await getScoreboard(g.league, g.date);
      return matchEvent(events, g.away, g.home);
    }));

    // attach resolved comp to each game so grouping keeps them aligned
    const withComp = list.map((g, i) => ({ g, comp: comps[i] }));
    const groups = groupByWeek(withComp.map(x => x.g));

    // build one column of cards per week group
    const cols = groups.map(grp => {
      let inner = `<div class="week-label">${grp.week}</div>`;
      for (const g of grp.items) {
        const rec = withComp.find(x => x.g === g);
        inner += renderGame(g, rec.comp);
      }
      return `<div class="week-col">${inner}</div>`;
    });

    document.getElementById(elId).innerHTML = cols.join('');
  }

  async function refresh() {
    // clear cache so each cycle pulls fresh scores
    for (const k in scoreboardCache) delete scoreboardCache[k];
    await Promise.all([
      renderColumn(cfbGames, 'cfb-body'),
      renderColumn(nflGames, 'nfl-body'),
    ]);
  }

  let lastRefresh = 0;
  const DAY = 86400000; // 24h

  async function maybeRefresh(force) {
    if (force || Date.now() - lastRefresh >= DAY) {
      lastRefresh = Date.now();
      await refresh();
    }
  }

  maybeRefresh(true);
  // hourly wake-up so an always-on display reliably refreshes once ~24h have passed
  setInterval(() => maybeRefresh(false), 3600000);
  // also refresh when the display/tab is brought back to the foreground
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) maybeRefresh(false);
  });
</script>
</body>
</html>
